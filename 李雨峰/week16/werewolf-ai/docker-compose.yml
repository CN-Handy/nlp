services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: werewolf-backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend/app/data/logs:/app/app/data/logs
    restart: unless-stopped
    networks:
      - werewolf-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=http://localhost:${BACKEND_PORT:-8000}
    container_name: werewolf-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - werewolf-net

networks:
  werewolf-net:
    driver: bridge
